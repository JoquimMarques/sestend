<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | SistEnd</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body class="auth-page">
    <div class="auth-card">
        <div class="auth-header">
            <i data-lucide="zap"></i>
            <h2>Sistend</h2>
            <p style="color: var(--text-dim);">Entre na sua conta para monitorar</p>
        </div>

        <form onsubmit="event.preventDefault(); window.location.href='index.html';">
            <div class="form-group">
                <label>Usuário</label>
                <input type="text" class="form-control" placeholder="Seu usuário" required>
            </div>
            <div class="form-group">
                <label>Senha</label>
                <input type="password" class="form-control" placeholder="••••••••" required>
            </div>
            <button type="submit" class="btn-primary" style="width: 100%; margin-top: 1rem;">Entrar</button>
        </form>

        <div class="auth-footer">
            Não tem conta? <a href="#">Solicitar Acesso</a>
        </div>
    </div>

    <script src="https://unpkg.com/lucide@latest"></script>
    <script>lucide.createIcons();</script>
</body>
</html>
