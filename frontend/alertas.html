<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Alertas | SistEnd</title>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <style>
        .main-content { margin-left: 0; padding: 1.5rem; width: 100%; box-sizing: border-box; }
        @media (min-width: 769px) { .main-content { margin-left: 260px; width: calc(100% - 260px); } }
        
        .badge-alerta {
            font-weight: bold;
            border: 1px solid currentColor;
            padding: 2px 8px;
            border-radius: 4px;
            font-size: 0.8rem;
        }
        .badge-alerta.critico { color: var(--accent-red); }
        .badge-alerta.normalizado { color: #32CD32; }
        .badge-alerta.aviso { color: var(--accent-orange); }
    </style>
</head>

<body>
    <div class="app-layout">
        <!-- Menu Lateral -->
        <aside class="sidebar" id="sidebar">
            <div class="sidebar-header">
                <i data-lucide="zap" class="logo-icon"></i>
                <span class="logo-text">Sistend</span>
            </div>

            <nav class="sidebar-nav">
                <a href="index.html" class="nav-item">
                    <i data-lucide="layout-dashboard"></i>
                    <span>Dashboard</span>
                </a>
                <a href="alertas.html" class="nav-item active">
                    <i data-lucide="alert-triangle"></i>
                    <span>Registros de Alarmes</span>
                </a>
                <a href="consumo.html" class="nav-item">
                    <i data-lucide="battery-low"></i>
                    <span>Registros de Consumo</span>
                </a>
                <a href="relatorio.html" class="nav-item">
                    <i data-lucide="clipboard-list"></i>
                    <span>Relatório Geral</span>
                </a>
                <hr style="border: none; border-top: 1px solid rgba(255,255,255,0.1); margin: 15px 0;">
                <a href="base_dados.html" class="nav-item">
                    <i data-lucide="database"></i>
                    <span>Base de Dados</span>
                </a>
                <a href="configuracoes.html" class="nav-item">
                    <i data-lucide="settings"></i>
                    <span>Configurações</span>
                </a>
            </nav>

            <div class="sidebar-footer">
                <div class="user-info" style="margin-bottom: 1rem; color: var(--text-dim); font-size: 0.9rem; display: flex; align-items: center; gap: 10px;">
                    <i data-lucide="user"></i>
                    <span>nelsonuser</span>
                </div>
                <a href="#" class="logout-link" style="color: var(--accent-red); text-decoration: none; font-size: 0.9rem; display: flex; align-items: center; gap: 10px;">
                    <i data-lucide="log-out"></i>
                    <span>Sair</span>
                </a>
            </div>
        </aside>

        <!-- Conteúdo Principal -->
        <main class="main-content">
            <header class="top-header">
                <div class="header-container" style="display: flex; align-items: center; justify-content: space-between; width: 100%;">
                    <div style="display: flex; align-items: center; gap: 15px;">
                        <button id="mobile-toggle" class="mobile-toggle">
                            <i data-lucide="menu"></i>
                        </button>
                        <div class="page-title-slot">Registros de Alarmes</div>
                    </div>
                </div>
            </header>

            <div class="page-content">
                <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 2rem;">
                    <h2 style="font-size: 1.8rem; margin: 0; color: var(--primary-color);">Alertas Recentes</h2>
                    <button onclick="limparAlertas()" class="btn-primary" style="background: var(--accent-red); box-shadow: 0 4px 15px rgba(239, 68, 68, 0.74); font-size: 0.8rem; padding: 0.5rem 1rem;">
                        <i data-lucide="trash-2"></i> Limpar Tudo
                    </button>
                </div>

                <div id="filter-bar" style="display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 0.8rem; margin-bottom: 1.2rem; background: var(--card-bg); border: 1px solid var(--glass-border); border-radius: 14px; padding: 1rem;">
                    <select id="filter-sensor" class="form-control" style="height: 44px;">
                        <option value="">Todos Dispositivos</option>
                    </select>
                    <select id="filter-tipo" class="form-control" style="height: 44px;">
                        <option value="">Todos Tipos</option>
                        <option value="PICO">Pico de Tensão</option>
                        <option value="SOBRECORRENTE">Sobrecorrente</option>
                        <option value="NORMALIZADO">Evento Normalizado</option>
                    </select>
                    <input type="date" id="filter-inicio" class="form-control" style="height: 44px;">
                    <input type="date" id="filter-fim" class="form-control" style="height: 44px;">
                    <input type="text" id="filter-q" placeholder="Buscar na descrição" class="form-control" style="height: 44px;">

                    <div style="grid-column: 1 / -1; display: flex; justify-content: space-between; align-items: center; gap: 0.8rem; flex-wrap: wrap;">
                        <div id="filter-count" style="color: var(--text-dim); font-size: 0.92rem;">0 registro(s) encontrado(s)</div>
                        <div style="display: flex; gap: 0.6rem;">
                            <button onclick="aplicarFiltros()" class="btn-primary" style="padding: 0.55rem 1rem; font-size: 0.85rem;">
                                <i data-lucide="filter"></i> Filtrar
                            </button>
                            <button onclick="limparFiltrosUI()" class="btn-primary" style="padding: 0.55rem 1rem; font-size: 0.85rem; background: rgba(255,255,255,0.08); box-shadow: none;">
                                <i data-lucide="rotate-ccw"></i> Limpar Filtros
                            </button>
                        </div>
                    </div>
                </div>

                <div class="table-wrapper">
                    <table id="alertas-table">
                        <thead>
                            <tr>
                                <th>Data/Hora</th>
                                <th>Equipamento</th>
                                <th>Tipo</th>
                                <th>Descrição</th>
                                <th style="text-align: center;">Ações</th>
                            </tr>
                        </thead>
                        <tbody>
                            <!-- Dados injetados via JS -->
                        </tbody>
                    </table>
                </div>
            </div>
        </main>
    </div>

    <div class="sidebar-overlay" id="sidebar-overlay"></div>

    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <script>lucide.createIcons();</script>
    
    <!-- Configuração Central -->
    <script src="config.js"></script>
    <script src="alertas.js"></script>
</body>

</html>
