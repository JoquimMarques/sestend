<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SistEnd | Base de Dados</title>
    <link rel="icon" href="img/favicon.ico" type="image/x-icon">
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <script src="auth.js"></script>
    <style>
        .main-content { margin-left: 0; padding: 2.5rem; width: 100%; box-sizing: border-box; }
        @media (min-width: 769px) { .main-content { margin-left: var(--sidebar-width); width: calc(100% - var(--sidebar-width)); } }
        
        .dispositivo-section {
            background: var(--card-bg);
            backdrop-filter: blur(20px);
            border: 1px solid var(--glass-border);
            border-radius: 28px;
            margin-bottom: 30px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
            overflow: hidden;
        }
        .section-header {
            background: rgba(168, 85, 247, 0.05);
            color: var(--text-light);
            padding: 20px 25px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--glass-border);
        }
        .section-header h2 { margin: 0; font-size: 1.3rem; display: flex; align-items: center; gap: 12px; font-weight: 700; color: var(--primary-color); }
        .device-badge {
            background: rgba(168, 85, 247, 0.1);
            border: 1px solid rgba(168, 85, 247, 0.3);
            color: var(--primary-color);
            padding: 6px 16px;
            border-radius: 20px;
            font-size: 0.8rem;
            font-weight: 700;
        }
        .empty-message { text-align: center; padding: 60px 20px; color: var(--text-dim); font-size: 0.95rem; }
    </style>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#1e0b3b">
    
    <!-- iOS / Safari PWA Tags -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="SistEnd">
    <link rel="apple-touch-icon" href="img/favicon/apple-touch-icon.png">
</head>

<body>
    <div class="app-layout">
        <!-- Menu Lateral -->
        <aside class="sidebar" id="sidebar">
            <div class="sidebar-header">
                <i data-lucide="zap" class="logo-icon"></i>
                <span class="logo-text">Sistend</span>
            </div>

            <div class="user-profile-mini">
                <div class="profile-avatar">N</div>
                <div class="profile-info">
                    <span class="profile-name">Nelson User</span>
                    <span class="profile-role">Administrador</span>
                </div>
            </div>

            <nav class="sidebar-nav">
                <a href="index.html" class="nav-item">
                    <i data-lucide="layout-dashboard"></i>
                    <span>Dashboard</span>
                </a>
                <a href="alertas.html" class="nav-item">
                    <i data-lucide="alert-triangle"></i>
                    <span>Registros de Alarmes</span>
                </a>
                <a href="consumo.html" class="nav-item">
                    <i data-lucide="battery-low"></i>
                    <span>Registros de Consumo</span>
                </a>
                <a href="relatorio.html" class="nav-item">
                    <i data-lucide="clipboard-list"></i>
                    <span>Relatório Geral</span>
                </a>
                <hr style="border: none; border-top: 1px solid rgba(255,255,255,0.1); margin: 15px 0;">
                <a href="base_dados.html" class="nav-item active">
                    <i data-lucide="database"></i>
                    <span>Base de Dados</span>
                </a>
                <a href="configuracoes.html" class="nav-item">
                    <i data-lucide="settings"></i>
                    <span>Configurações</span>
                </a>
            </nav>

            <div class="sidebar-footer">
                <a href="login.html" class="logout-link" onclick="localStorage.removeItem('sistend_user')">
                    <i data-lucide="log-out"></i>
                    <span>Sair do Sistema</span>
                </a>
            </div>
        </aside>

        <!-- Conteúdo Principal -->
        <main class="main-content">
            <header class="top-header">
                <div class="header-container">
                    <div style="display: flex; align-items: center; gap: 15px;">
                        <button id="mobile-toggle" class="mobile-toggle" onclick="toggleSidebar()">
                            <i data-lucide="menu"></i>
                        </button>
                        <div class="page-title-slot">Base de Dados</div>
                    </div>
                </div>
            </header>

            <div class="page-content">
                <div id="database-container">
                    <!-- Cards dos dispositivos injetados via JS -->
                </div>
            </div>
        </main>
    </div>

    <div class="sidebar-overlay" id="sidebar-overlay" onclick="closeSidebar()"></div>

    <script src="https://unpkg.com/lucide@latest"></script>
    <script>lucide.createIcons();</script>
    
    <!-- Configuração Central -->
    <script src="config.js"></script>
    <script src="base_dados.js"></script>
</body>

</html>
