{% extends "base.html" %}
{% block title %}Login | SistEnd{% endblock %}

{% block content %}
<style>
    /* Ocultar navegação na tela de login */
    .sidebar {
        display: none !important;
    }

    .main-content {
        margin-left: 0 !important;
        padding: 0 !important;
    }

    .top-header {
        display: none !important;
    }
</style>

<div class="auth-page">
    <div class="auth-card">
        <div class="auth-header">
            <i data-lucide="lock"></i>
            <h2>Bem-vindo de volta</h2>
            <p style="color: var(--text-dim); font-size: 0.9rem;">Entre para acessar o painel de monitoramento.</p>
        </div>

        <form method="post">
            {% csrf_token %}
            <div class="form-group">
                <label for="username">Usuário</label>
                <input type="text" name="username" id="username" class="form-control" placeholder="Seu usuário" required
                    autofocus>
            </div>
            <div class="form-group">
                <label for="password">Senha</label>
                <div class="password-input-wrap">
                    <input type="password" name="password" id="password" class="form-control"
                        placeholder="Sua senha" required>
                    <button type="button" class="password-toggle" onclick="togglePassword('password', this)"
                        aria-label="Mostrar ou ocultar senha" title="Mostrar/ocultar senha">
                        <i data-lucide="eye"></i>
                    </button>
                </div>
            </div>

            {% if error %}
            <p style="color: var(--accent-red); font-size: 0.85rem; margin-bottom: 1rem;">{{ error }}</p>
            {% endif %}

            <button type="submit" class="btn-primary" style="width: 100%; margin-top: 1rem;">
                Entrar no Sistema
            </button>
        </form>

        <div class="auth-footer">
            Não tem uma conta? <a href="{% url 'registro' %}">Cadastre-se</a>
        </div>
    </div>
</div>

<script>
    function togglePassword(inputId, btn) {
        const input = document.getElementById(inputId);
        if (!input) return;
        const showing = input.type === 'text';
        input.type = showing ? 'password' : 'text';
        btn.innerHTML = showing ? '<i data-lucide="eye"></i>' : '<i data-lucide="eye-off"></i>';
        if (window.lucide) {
            lucide.createIcons();
        }
    }

    if (window.lucide) {
        lucide.createIcons();
    }
</script>
{% endblock %}
