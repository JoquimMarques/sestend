<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SistEnd | Alarmes</title>
    <link rel="icon" href="img/favicon.ico" type="image/x-icon">
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <script src="auth.js"></script>
    <style>
        .main-content { margin-left: 0; padding: 1rem 0.85rem; width: 100%; box-sizing: border-box; }
        @media (min-width: 769px) { .main-content { margin-left: var(--sidebar-width); padding: 2rem; width: calc(100% - var(--sidebar-width)); } }
        
        .badge-alerta {
            font-weight: 700;
            border: 1px solid currentColor;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 0.75rem;
            text-transform: uppercase;
            white-space: nowrap;
        }
        .badge-alerta.critico { color: var(--accent-red); background: rgba(239, 68, 68, 0.1); }
        .badge-alerta.normalizado { color: #4ade80; background: rgba(74, 222, 128, 0.1); }
        .badge-alerta.aviso { color: var(--accent-orange); background: rgba(251, 191, 36, 0.1); }
        @media (max-width: 768px) {
            .badge-alerta { font-size: 0.68rem; padding: 3px 10px; }
        }
    </style>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#0f2440">
    
    <!-- iOS / Safari PWA Tags -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="SistEnd">
    <link rel="apple-touch-icon" href="img/favicon/apple-touch-icon.png">
</head>

<body>
    <div class="app-layout">
        <!-- Menu Lateral -->
        <aside class="sidebar" id="sidebar">
            <div class="sidebar-header">
                <div class="logo-brand">
                    <div class="logo-icon-wrap"><i data-lucide="zap"></i></div>
                    <span class="logo-text">SistEnd</span>
                </div>
            </div>

            <div class="sidebar-scroll">
                <div class="sidebar-section-title">Painel de Controlo</div>
                <nav class="sidebar-nav">
                    <a href="index.html" class="nav-item">
                        <i data-lucide="layout-dashboard"></i><span>Dashboard</span>
                    </a>
                    <a href="alertas.html" class="nav-item active">
                        <i data-lucide="alert-triangle"></i><span>Registros de Alarmes</span>
                    </a>
                    <a href="consumo.html" class="nav-item">
                        <i data-lucide="battery-low"></i><span>Registros de Consumo</span>
                    </a>
                    <a href="relatorio.html" class="nav-item">
                        <i data-lucide="clipboard-list"></i><span>Relatório Geral</span>
                    </a>
                </nav>

                <div class="sidebar-section-title">Minha Conta</div>
                <nav class="sidebar-nav">
                    <a href="base_dados.html" class="nav-item">
                        <i data-lucide="database"></i><span>Base de Dados</span>
                    </a>
                    <a href="configuracoes.html" class="nav-item">
                        <i data-lucide="settings"></i><span>Configurações</span>
                    </a>
                </nav>
            </div>

            <div class="sidebar-footer">
                <div class="user-profile-mini">
                    <div class="profile-avatar">N</div>
                    <div class="profile-info">
                        <span class="profile-name">Nelson User</span>
                        <span class="profile-role">Administrador</span>
                    </div>
                </div>
                <a href="login.html" class="logout-link" onclick="localStorage.removeItem('sistend_user')">
                    <i data-lucide="log-out"></i><span>Sair do Sistema</span>
                </a>
            </div>
        </aside>

        <!-- Conteúdo Principal -->
        <main class="main-content">
            <header class="top-header">
                <div class="header-container">
                    <div style="display: flex; align-items: center; gap: 15px;">
                        <button id="mobile-toggle" class="mobile-toggle" onclick="toggleSidebar()">
                            <i data-lucide="menu"></i>
                        </button>
                        <div class="page-title-slot">Alarmes</div>
                    </div>
                </div>
            </header>

            <div class="page-content">
                <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 1.5rem; flex-wrap: wrap; gap: 1rem;">
                    <h2 style="font-size: 1.4rem; margin: 0; color: var(--text-dark); font-weight: 700;">Alertas Recentes</h2>
                    <div style="display: flex; gap: 1rem; flex-wrap: wrap;">
                        <button onclick="abrirModalFiltros()" class="btn-primary" style="background:#f1f5f9;border:1px solid var(--border-color);color:var(--text-dark);">
                            <i data-lucide="filter"></i> Filtros
                        </button>
                        <button onclick="limparAlertas()" class="btn-primary" style="background: var(--accent-red); box-shadow: 0 4px 15px rgba(239, 68, 68, 0.3);">
                            <i data-lucide="trash-2"></i> Limpar Tudo
                        </button>
                    </div>
                </div>

                <div id="filter-count-bar" style="display:none; color: var(--text-dim); font-size: 0.85rem; margin-bottom: 1rem;"></div>

                <div class="table-wrapper">
                    <table id="alertas-table">
                        <thead>
                            <tr>
                                <th>Data/Hora</th>
                                <th>Equipamento</th>
                                <th>Tipo</th>
                                <th>Descrição</th>
                                <th style="text-align: center;">Ações</th>
                            </tr>
                        </thead>
                        <tbody>
                            <!-- Dados via JS -->
                        </tbody>
                    </table>
                </div>

                <!-- Paginação -->
                <div id="pagination-container" style="display: none; flex-direction: column; align-items: center; margin-top: 2rem; gap: 1rem;">
                    <button id="btn-ver-mais" onclick="verMais()" class="btn-load-more" style="background: linear-gradient(135deg, #3b82f6, #2563eb); border: none; color: white; padding: 0.8rem 2rem; border-radius: 12px; cursor: pointer; display: flex; align-items: center; gap: 8px; font-weight: 600;">
                        <i data-lucide="chevron-down"></i> Ver Mais Registros
                    </button>
                    <div id="pagination-info" style="color: var(--text-dim); font-size: 0.85rem;"></div>
                </div>
            </div>
        </main>
    </div>

    <div class="sidebar-overlay" id="sidebar-overlay" onclick="closeSidebar()"></div>

    <!-- Modal de Filtros -->
    <div class="modal-overlay" id="modal-filtros">
        <div class="modal-content" style="max-width: 500px; width: 92%;">
            <div class="modal-header">
                <h2><i data-lucide="filter" style="width:20px;height:20px;vertical-align:middle;margin-right:8px;"></i>Filtrar Alertas</h2>
                <button class="modal-close" onclick="fecharModalFiltros()"><i data-lucide="x"></i></button>
            </div>

            <div class="form-group">
                <label>Dispositivo</label>
                <select id="filter-sensor" style="width:100%;outline:none;">
                    <option value="">Todos</option>
                </select>
            </div>
            <div class="form-group">
                <label>Tipo de Evento</label>
                <select id="filter-tipo" style="width:100%;outline:none;">
                    <option value="">Todos</option>
                    <option value="PICO">Pico de Tensão</option>
                    <option value="SOBRECORRENTE">Sobrecorrente</option>
                    <option value="NORMALIZADO">Evento Normalizado</option>
                </select>
            </div>
            <div style="display:grid;grid-template-columns:1fr 1fr;gap:1rem;">
                <div class="form-group" style="margin-bottom:0;">
                    <label>Data Início</label>
                    <input type="date" id="filter-inicio" style="width:100%;box-sizing:border-box;">
                </div>
                <div class="form-group" style="margin-bottom:0;">
                    <label>Data Fim</label>
                    <input type="date" id="filter-fim" style="width:100%;box-sizing:border-box;">
                </div>
            </div>

            <div id="filter-count" style="color: var(--text-dim); font-size: 0.85rem; margin-top: 1.2rem;">0 registro(s) encontrado(s)</div>

            <div class="modal-footer" style="justify-content: space-between;">
                <button onclick="limparFiltrosUI()" class="btn-icon-action" title="Limpar Filtros" style="padding: 0.7rem 1.2rem; display:flex; align-items:center; gap:6px;">
                    <i data-lucide="rotate-ccw"></i> Limpar
                </button>
                <div style="display:flex;gap:0.75rem;">
                    <button onclick="fecharModalFiltros()" class="btn-primary" style="background:#f1f5f9;color:var(--text-muted);">Cancelar</button>
                    <button onclick="aplicarFiltros(); fecharModalFiltros();" class="btn-primary">
                        <i data-lucide="filter"></i> Aplicar
                    </button>
                </div>
            </div>
        </div>
    </div>

    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <script>lucide.createIcons();</script>

    <!-- Configuração Central -->
    <script src="config.js"></script>
    <script src="alertas.js"></script>
</body>

</html>
