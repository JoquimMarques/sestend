<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SistEnd | Consumo</title>
    <link rel="icon" href="img/favicon.ico" type="image/x-icon">
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <script src="auth.js"></script>
    <style>
        .main-content { margin-left: 0; padding: 2.5rem; width: 100%; box-sizing: border-box; }
        @media (min-width: 769px) { .main-content { margin-left: var(--sidebar-width); width: calc(100% - var(--sidebar-width)); } }
    </style>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#1e0b3b">
    <link rel="apple-touch-icon" href="img/icon-192x192.png">
</head>

<body>
    <div class="app-layout">
        <!-- Menu Lateral -->
        <aside class="sidebar" id="sidebar">
            <div class="sidebar-header">
                <i data-lucide="zap" class="logo-icon"></i>
                <span class="logo-text">Sistend</span>
            </div>

            <div class="user-profile-mini">
                <div class="profile-avatar">N</div>
                <div class="profile-info">
                    <span class="profile-name">Nelson User</span>
                    <span class="profile-role">Administrador</span>
                </div>
            </div>

            <nav class="sidebar-nav">
                <a href="index.html" class="nav-item">
                    <i data-lucide="layout-dashboard"></i>
                    <span>Dashboard</span>
                </a>
                <a href="alertas.html" class="nav-item">
                    <i data-lucide="alert-triangle"></i>
                    <span>Registros de Alarmes</span>
                </a>
                <a href="consumo.html" class="nav-item active">
                    <i data-lucide="battery-low"></i>
                    <span>Registros de Consumo</span>
                </a>
                <a href="relatorio.html" class="nav-item">
                    <i data-lucide="clipboard-list"></i>
                    <span>Relatório Geral</span>
                </a>
                <hr style="border: none; border-top: 1px solid rgba(255,255,255,0.1); margin: 15px 0;">
                <a href="base_dados.html" class="nav-item">
                    <i data-lucide="database"></i>
                    <span>Base de Dados</span>
                </a>
                <a href="configuracoes.html" class="nav-item">
                    <i data-lucide="settings"></i>
                    <span>Configurações</span>
                </a>
            </nav>

            <div class="sidebar-footer">
                <a href="login.html" class="logout-link" onclick="localStorage.removeItem('sistend_user')">
                    <i data-lucide="log-out"></i>
                    <span>Sair do Sistema</span>
                </a>
            </div>
        </aside>

        <!-- Conteúdo Principal -->
        <main class="main-content">
            <header class="top-header">
                <div class="header-container">
                    <div style="display: flex; align-items: center; gap: 15px;">
                        <button id="mobile-toggle" class="mobile-toggle" onclick="toggleSidebar()">
                            <i data-lucide="menu"></i>
                        </button>
                        <div class="page-title-slot">Consumo</div>
                    </div>
                </div>
            </header>

            <div class="page-content">
                <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 2rem; flex-wrap: wrap; gap: 1rem;">
                    <h2 style="font-size: 1.4rem; margin: 0; color: var(--text-light); font-weight: 700;">Histórico de Consumo</h2>
                    <div style="display: flex; gap: 1rem;">
                        <button onclick="document.getElementById('filter-bar-container').style.display = document.getElementById('filter-bar-container').style.display === 'none' ? 'grid' : 'none'" class="btn-primary" style="background: var(--card-bg); border: 1px solid var(--glass-border);">
                            <i data-lucide="filter"></i> Filtros
                        </button>
                        <button onclick="limparConsumo()" class="btn-primary" style="background: var(--accent-red); box-shadow: 0 4px 15px rgba(239, 68, 68, 0.3);">
                            <i data-lucide="trash-2"></i> Limpar Tudo
                        </button>
                    </div>
                </div>

                <div class="filter-bar" id="filter-bar-container" style="display: none;">
                    <div class="filter-group">
                        <label>Dispositivo</label>
                        <select id="filter-sensor" class="form-control">
                            <option value="">Todos</option>
                        </select>
                    </div>
                    <div class="filter-group">
                        <label>Início</label>
                        <input type="date" id="filter-inicio" class="form-control">
                    </div>
                    <div class="filter-group">
                        <label>Fim</label>
                        <input type="date" id="filter-fim" class="form-control">
                    </div>

                    <div class="filter-actions">
                        <div id="filter-count" style="color: var(--text-dim); font-size: 0.9rem;">0 registro(s) encontrado(s)</div>
                        <div style="display: flex; gap: 0.8rem;">
                            <button onclick="limparFiltrosUI()" class="btn-icon-action" title="Limpar Filtros">
                                <i data-lucide="rotate-ccw"></i>
                            </button>
                            <button onclick="aplicarFiltros()" class="btn-primary">
                                <i data-lucide="filter"></i> Aplicar Filtros
                            </button>
                        </div>
                    </div>
                </div>

                <div class="table-wrapper">
                    <table id="consumo-table">
                        <thead>
                            <tr>
                                <th>DATA/HORA</th>
                                <th>EQUIPAMENTO</th>
                                <th>TENSÃO (V)</th>
                                <th>CONSUMO (KWH)</th>
                                <th style="text-align: center;">AÇÕES</th>
                            </tr>
                        </thead>
                        <tbody>
                            <!-- Injetado via JS -->
                        </tbody>
                    </table>
                </div>

                <!-- Paginação similar ao Relatório Geral -->
                <div id="pagination-container" style="display: none; flex-direction: column; align-items: center; margin-top: 2rem; gap: 1rem;">
                    <button id="btn-ver-mais" onclick="verMais()" class="btn-load-more" style="background: linear-gradient(135deg, #a855f7, #9333ea); border: none; color: white; padding: 0.8rem 2rem; border-radius: 12px; cursor: pointer; display: flex; align-items: center; gap: 8px; font-weight: 600;">
                        <i data-lucide="chevron-down"></i> Ver Mais Registros
                    </button>
                    <div id="pagination-info" style="color: var(--text-dim); font-size: 0.85rem;"></div>
                </div>
            </div>
        </main>
    </div>

    <div class="sidebar-overlay" id="sidebar-overlay" onclick="closeSidebar()"></div>

    <script src="https://unpkg.com/lucide@latest"></script>
    <script>lucide.createIcons();</script>
    
    <!-- Configuração Central -->
    <script src="config.js"></script>
    <script src="consumo.js"></script>
</body>

</html>
