<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SistEnd | Configurações</title>
    <link rel="icon" href="img/favicon.ico" type="image/x-icon">
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <script src="auth.js"></script>
    <style>
        .main-content { margin-left: 0; padding: 2.5rem; width: 100%; box-sizing: border-box; }
        @media (min-width: 769px) { .main-content { margin-left: var(--sidebar-width); width: calc(100% - var(--sidebar-width)); } }
        
        .config-card {
            background: var(--card-bg);
            backdrop-filter: blur(20px);
            border: 1px solid var(--glass-border);
            border-radius: 24px;
            padding: 25px;
            margin-bottom: 25px;
            color: var(--text-light);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
        }
        .config-card h3 { margin-top: 0; margin-bottom: 20px; font-size: 1.4em; display: flex; align-items: center; gap: 12px; color: var(--primary-color); }
        .limites-grupo { background: rgba(168, 85, 247, 0.05); padding: 20px; border-radius: 16px; margin-bottom: 15px; border: 1px solid rgba(168, 85, 247, 0.1); }
        .limites-grupo h4 { margin-top: 0; margin-bottom: 15px; font-size: 1.05em; color: var(--accent-purple); }
        .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; }
        .form-group { display: flex; flex-direction: column; margin-bottom: 1rem; }
        .form-group label { margin-bottom: 8px; font-weight: 600; font-size: 0.9em; color: var(--text-dim); }
        .form-group input { 
            padding: 12px; border: 1px solid var(--glass-border); border-radius: 12px; 
            background: rgba(0, 0, 0, 0.2); color: white; font-size: 1em; transition: all 0.3s;
        }
        .form-group input:focus { border-color: var(--primary-color); outline: none; box-shadow: 0 0 0 4px rgba(168, 85, 247, 0.1); }
        .btn-salvar { 
            width: 100%; padding: 14px; background: var(--primary-color); 
            border: none; color: white; border-radius: 14px; cursor: pointer; font-weight: 700; transition: all 0.3s;
        }
        .btn-salvar:hover { background: var(--primary-hover); transform: translateY(-2px); box-shadow: 0 5px 15px rgba(168, 85, 247, 0.3); }
        .sensor-label { background: rgba(168, 85, 247, 0.1); color: var(--primary-color); padding: 4px 12px; border-radius: 20px; font-size: 0.8em; font-weight: 600; margin-left: 10px; }
    </style>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#1e0b3b">
    <link rel="apple-touch-icon" href="img/icon-192x192.png">
</head>

<body>
    <div class="app-layout">
        <!-- Menu Lateral -->
        <aside class="sidebar" id="sidebar">
            <div class="sidebar-header">
                <i data-lucide="zap" class="logo-icon"></i>
                <span class="logo-text">Sistend</span>
            </div>

            <div class="user-profile-mini">
                <div class="profile-avatar">N</div>
                <div class="profile-info">
                    <span class="profile-name">Nelson User</span>
                    <span class="profile-role">Administrador</span>
                </div>
            </div>

            <nav class="sidebar-nav">
                <a href="index.html" class="nav-item">
                    <i data-lucide="layout-dashboard"></i>
                    <span>Dashboard</span>
                </a>
                <a href="alertas.html" class="nav-item">
                    <i data-lucide="alert-triangle"></i>
                    <span>Registros de Alarmes</span>
                </a>
                <a href="consumo.html" class="nav-item">
                    <i data-lucide="battery-low"></i>
                    <span>Registros de Consumo</span>
                </a>
                <a href="relatorio.html" class="nav-item">
                    <i data-lucide="clipboard-list"></i>
                    <span>Relatório Geral</span>
                </a>
                <hr style="border: none; border-top: 1px solid rgba(255,255,255,0.1); margin: 15px 0;">
                <a href="base_dados.html" class="nav-item">
                    <i data-lucide="database"></i>
                    <span>Base de Dados</span>
                </a>
                <a href="configuracoes.html" class="nav-item active">
                    <i data-lucide="settings"></i>
                    <span>Configurações</span>
                </a>
            </nav>

            <div class="sidebar-footer">
                <a href="login.html" class="logout-link" onclick="localStorage.removeItem('sistend_user')">
                    <i data-lucide="log-out"></i>
                    <span>Sair do Sistema</span>
                </a>
            </div>
        </aside>

        <!-- Conteúdo Principal -->
        <main class="main-content">
            <header class="top-header">
                <div class="header-container">
                    <div style="display: flex; align-items: center; gap: 15px;">
                        <button id="mobile-toggle" class="mobile-toggle" onclick="toggleSidebar()">
                            <i data-lucide="menu"></i>
                        </button>
                        <div class="page-title-slot">Configurações do Sistema</div>
                    </div>
                </div>
            </header>

            <div class="page-content">
                <div id="config-list">
                    <!-- Cards de configuração injetados via JS -->
                </div>
            </div>
        </main>
    </div>

    <div class="sidebar-overlay" id="sidebar-overlay" onclick="closeSidebar()"></div>

    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <script>lucide.createIcons();</script>
    
    <!-- Configuração Central -->
    <script src="config.js"></script>
    <script src="configuracoes.js"></script>
</body>

</html>
