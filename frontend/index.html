<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SistEnd | Monitoramento Real-Time</title>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <style>
        /* Ajustes para versão desacoplada */
        .main-content { margin-left: 0; padding: 1.5rem; width: 100%; box-sizing: border-box; }
        @media (min-width: 769px) { .main-content { margin-left: 260px; width: calc(100% - 260px); } }
    </style>
</head>

<body>
    <div class="app-layout">
        <!-- Menu Lateral -->
        <aside class="sidebar" id="sidebar">
            <div class="sidebar-header">
                <i data-lucide="zap" class="logo-icon"></i>
                <span class="logo-text">Sistend</span>
            </div>

            <nav class="sidebar-nav">
                <a href="index.html" class="nav-item active">
                    <i data-lucide="layout-dashboard"></i>
                    <span>Dashboard</span>
                </a>
                <a href="#" class="nav-item">
                    <i data-lucide="alert-triangle"></i>
                    <span>Registros de Alarmes</span>
                </a>
                <a href="#" class="nav-item">
                    <i data-lucide="clipboard-list"></i>
                    <span>Relatório Geral</span>
                </a>
            </nav>

            <div class="sidebar-footer">
                <div class="user-info">
                    <i data-lucide="globe"></i>
                    <span>Modo Online (API)</span>
                </div>
            </div>
        </aside>

        <!-- Conteúdo Principal -->
        <main class="main-content">
            <header class="top-header">
                <div class="header-container">
                    <button id="mobile-toggle" class="mobile-toggle">
                        <i data-lucide="menu"></i>
                    </button>
                    <div class="page-title-slot">Dashboard de Monitoramento</div>
                </div>
            </header>

            <div class="page-content">
                <div id="device-grid" class="dashboard-grid">
                    <!-- Os cartões dos dispositivos serão injetados aqui via JS -->
                    <div style="grid-column: 1/-1; text-align: center; padding: 3rem; color: var(--text-dim);">
                        <div class="loader" style="border: 4px solid rgba(255,255,255,0.1); border-top: 4px solid var(--primary-color); border-radius: 50%; width: 40px; height: 40px; animation: spin 1s linear infinite; margin: 0 auto 1rem;"></div>
                        Conectando à API do Backend...
                    </div>
                </div>
            </div>
        </main>
    </div>

    <div class="sidebar-overlay" id="sidebar-overlay"></div>

    <style>
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>

    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <script>lucide.createIcons();</script>
    
    <!-- Configuração do Backend -->
    <script>
        // Mude para o link do Render quando fizer o deploy:
        // window.BACKEND_URL = "https://seu-backend.onrender.com";
        window.BACKEND_URL = "http://localhost:8000";
    </script>
    
    <script src="app.js"></script>
</body>

</html>
